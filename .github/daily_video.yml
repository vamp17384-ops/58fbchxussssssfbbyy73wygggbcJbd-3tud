name: Reddit Story Bot — Daily Video

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg & fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python packages
        run: pip install edge-tts requests

      - name: Generate video
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          GDRIVE_FOLDER:     RedditStoryBot
        run: python generate_video.py

      - name: Save video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reddit-video-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 7
