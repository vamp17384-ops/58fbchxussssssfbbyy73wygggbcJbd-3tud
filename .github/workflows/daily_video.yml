name: 🎬 Reddit Story Bot — Daily Video

on:
  # Runs every day at 10:00 AM UTC (adjust to your timezone)
  schedule:
    - cron: '0 10 * * *'

  # Also lets you trigger it manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Check out your repo (includes backgrounds/ folder) ──────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Install FFmpeg + fonts ──────────────────────────────────────────
      - name: Install FFmpeg & fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      # ── 3. Install rclone ─────────────────────────────────────────────────
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # ── 4. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 5. Install Python dependencies ────────────────────────────────────
      - name: Install Python packages
        run: pip install gtts requests

      # ── 6. Run the bot ────────────────────────────────────────────────────
      - name: Generate video
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          GDRIVE_FOLDER:     RedditStoryBot
        run: python generate_video.py

      # ── 7. (Optional) Upload video as GitHub artifact for 7 days ──────────
      #    Useful as a backup — download directly from the Actions run page.
      - name: Save video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reddit-video-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 7
